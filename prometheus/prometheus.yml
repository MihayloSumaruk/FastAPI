global:
  scrape_interval: 5s # Прискоримо збір для лаби

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'fastapi-app' # Залишаємо так
    static_configs:
      - targets: ['app:8000'] 

  - job_name: 'postgres-db'
    static_configs:
      - targets: ['postgres-monitor:9187']

  - job_name: 'docker-monitor' # Змінили з docker-containers на docker-monitor
    static_configs:
      - targets: ['docker-monitor:8080']