[tool.poetry]
name = "fastapi-lab"
version = "0.1.0"
description = "Lab 4 - DB and Migrations"
authors = ["Student"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "*"
pydantic-settings = "^2.1.0"

uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = "^2.0.0"
alembic = "^1.12.0"
psycopg2-binary = "^2.9.9"
asyncpg = "^0.29.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"